[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inferno"
version = "0.1.0"
description = "Production-grade distributed ML inference platform"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# Core runtime deps stay single-sourced in requirements.txt (read at build time),
# so the wheel never drifts from the pinned, verified set.
dynamic = ["dependencies"]

[project.optional-dependencies]
# The heavy ML stacks carry PyTorch's --extra-index-url, which a wheel's metadata
# cannot encode — install them from the requirements files instead:
#   pip install -r requirements-ml-cpu.txt     # CPU
#   pip install -r requirements-ml-gpu.txt     # CUDA 12.4
dev = ["ruff>=0.6", "mypy>=1.10", "build", "conda-pack"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
exclude = ["backend.tests*"]

# Ship the non-Python runtime assets the app loads (model registry + RAG corpus).
[tool.setuptools.package-data]
"backend.models" = ["models.yaml", "corpus/*.md"]

[tool.pytest.ini_options]
# Tests import the backend as `backend.*`; put the repo root on the path so no
# editable install is required.
pythonpath = ["."]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q -ra"
markers = [
    "integration: end-to-end tests that require a running Redis (auto-skip if absent)",
    "ml: tests that require the heavy ML stack (torch/onnx/transformers)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"backend/models/semantic_search.py" = ["E501"]  # readable long corpus sentences

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
