# --- yolo-detect (object detection) ------------------------------------------ #
apiVersion: apps/v1
kind: Deployment
metadata: { name: worker-yolo, namespace: inferno, labels: { app: worker, model: yolo-detect } }
spec:
  replicas: 1
  selector: { matchLabels: { app: worker, model: yolo-detect } }
  template:
    metadata: { labels: { app: worker, model: yolo-detect } }
    spec:
      containers:
        - name: worker
          image: ghcr.io/sagarchry0777/inferno:latest
          command: ["python", "-m", "backend.worker.main"]
          env:
            - { name: INFERNO_WORKER__MODEL_NAME, value: "yolo-detect" }
            - { name: YOLO_CONFIG_DIR, value: "/models/ultralytics" }
          envFrom:
            - configMapRef: { name: inferno-config }
