# --- semantic-search (embeddings + cosine search) ---------------------------- #
# Declared in backend/models/models.yaml, so GET /models advertises it and the UI
# offers it. Without this Deployment nothing consumes inferno:jobs:semantic-search
# and every such job hangs until the client's 30s timeout.
apiVersion: apps/v1
kind: Deployment
metadata: { name: worker-semantic, namespace: inferno, labels: { app: worker, model: semantic-search } }
spec:
  replicas: 1
  selector: { matchLabels: { app: worker, model: semantic-search } }
  template:
    metadata: { labels: { app: worker, model: semantic-search } }
    spec:
      containers:
        - name: worker
          image: ghcr.io/sagarchry0777/inferno:latest
          command: ["python", "-m", "backend.worker.main"]
          env:
            - { name: INFERNO_WORKER__MODEL_NAME, value: "semantic-search" }
          envFrom:
            - configMapRef: { name: inferno-config }
          readinessProbe:
            exec:
              command: ["python", "-c", "import os,sys,time; p=os.environ.get('INFERNO_WORKER__LIVENESS_FILE','/tmp/inferno-worker-alive'); sys.exit(0 if os.path.exists(p) else 1)"]
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["python", "-c", "import os,sys,time; p=os.environ.get('INFERNO_WORKER__LIVENESS_FILE','/tmp/inferno-worker-alive'); sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 120 else 1)"]
            initialDelaySeconds: 120
            periodSeconds: 30
