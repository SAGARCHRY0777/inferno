# One Deployment per model — shared-nothing worker processes. Each runs
# `python -m backend.worker.main` with INFERNO_WORKER__MODEL_NAME selecting the
# model. Replica count is the floor; KEDA scales them on queue depth (see
# autoscaling-keda.yaml). ML workers get a model-cache volume so HF/torch weights
# download once per pod (HF_HOME=/models/hf comes from the ConfigMap).
#
# NOTE: this is one explicit Deployment per model for clarity. In a larger fleet
# you'd template these (Kustomize components / a Helm chart) instead of repeating.

# --- dummy-echo (dependency-free, tiny) -------------------------------------- #
apiVersion: apps/v1
kind: Deployment
metadata: { name: worker-dummy, namespace: inferno, labels: { app: worker, model: dummy-echo } }
spec:
  replicas: 1
  selector: { matchLabels: { app: worker, model: dummy-echo } }
  template:
    metadata: { labels: { app: worker, model: dummy-echo } }
    spec:
      containers:
        - name: worker
          image: ghcr.io/sagarchry0777/inferno:latest
          command: ["python", "-m", "backend.worker.main"]
          env:
            - { name: INFERNO_WORKER__MODEL_NAME, value: "dummy-echo" }
          envFrom:
            - configMapRef: { name: inferno-config }
          # Workers serve no HTTP -- the liveness signal is the mtime of the file
          # the worker touches on every heartbeat (WorkerSettings.liveness_file).
          # Readiness: the file only appears once the model is loaded and warmed
          # up, so a rollout waits for a genuinely useful worker.
          readinessProbe:
            exec:
              command: ["python", "-c", "import os,sys,time; p=os.environ.get('INFERNO_WORKER__LIVENESS_FILE','/tmp/inferno-worker-alive'); sys.exit(0 if os.path.exists(p) else 1)"]
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 60          # allow up to ~10 min for a cold model download
          livenessProbe:
            exec:
              command: ["python", "-c", "import os,sys,time; p=os.environ.get('INFERNO_WORKER__LIVENESS_FILE','/tmp/inferno-worker-alive'); sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 120 else 1)"]
            initialDelaySeconds: 120      # never race the initial model load
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
