# One Deployment per model — shared-nothing worker processes. Each runs
# `python -m backend.worker.main` with INFERNO_WORKER__MODEL_NAME selecting the
# model. Replica count is the floor; KEDA scales them on queue depth (see
# autoscaling-keda.yaml). ML workers get a model-cache volume so HF/torch weights
# download once per pod (HF_HOME=/models/hf comes from the ConfigMap).
#
# NOTE: this is one explicit Deployment per model for clarity. In a larger fleet
# you'd template these (Kustomize components / a Helm chart) instead of repeating.

# --- dummy-echo (dependency-free, tiny) -------------------------------------- #
apiVersion: apps/v1
kind: Deployment
metadata: { name: worker-dummy, namespace: inferno, labels: { app: worker, model: dummy-echo } }
spec:
  replicas: 1
  selector: { matchLabels: { app: worker, model: dummy-echo } }
  template:
    metadata: { labels: { app: worker, model: dummy-echo } }
    spec:
      containers:
        - name: worker
          image: ghcr.io/sagarchry0777/inferno:latest
          command: ["python", "-m", "backend.worker.main"]
          env:
            - { name: INFERNO_WORKER__MODEL_NAME, value: "dummy-echo" }
          envFrom:
            - configMapRef: { name: inferno-config }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
# --- distilbert-sentiment (HF text) ------------------------------------------ #
apiVersion: apps/v1
kind: Deployment
metadata: { name: worker-distilbert, namespace: inferno, labels: { app: worker, model: distilbert-sentiment } }
spec:
  replicas: 1
  selector: { matchLabels: { app: worker, model: distilbert-sentiment } }
  template:
    metadata: { labels: { app: worker, model: distilbert-sentiment } }
    spec:
      containers:
        - name: worker
          image: ghcr.io/sagarchry0777/inferno:latest
          command: ["python", "-m", "backend.worker.main"]
          env:
            - { name: INFERNO_WORKER__MODEL_NAME, value: "distilbert-sentiment" }
          envFrom:
            - configMapRef: { name: inferno-config }
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { cpu: "2", memory: "4Gi" }
          volumeMounts:
            - { name: model-cache, mountPath: /models }
      volumes:
        - { name: model-cache, emptyDir: {} }
---
