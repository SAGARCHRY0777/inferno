# Single entrypoint. All traffic goes to the frontend, whose nginx proxies
# /api (REST + WebSockets), /metrics and /chat (SSE) to the gateway/chat
# Services internally — so one host serves the whole app, same-origin (no CORS).
# proxy-read-timeout is raised for long-lived WebSocket + SSE streams.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inferno
  namespace: inferno
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  # Required unless the cluster has an IngressClass marked
  # ingressclass.kubernetes.io/is-default-class=true. Without it no controller
  # claims this Ingress: `kubectl apply -k k8s/` reports success and nothing is
  # ever routed. Change this if your controller is not ingress-nginx
  # (`kubectl get ingressclass` lists what the cluster has).
  ingressClassName: nginx
  rules:
    - host: inferno.local          # add to /etc/hosts -> ingress IP, or use your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
