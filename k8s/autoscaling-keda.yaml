# Queue-depth autoscaling — the right way to scale ML workers.
#
# CPU HPAs are a poor proxy for inference workers (a worker blocked on a slow
# forward pass shows low CPU while the queue backs up). KEDA's redis-streams
# scaler reads the actual backlog on each model's job stream
# (inferno:jobs:<model>) and scales that model's Deployment to keep roughly
# `streamLength` jobs queued per replica. Scale-to-zero is possible
# (minReplicaCount: 0) for rarely-used models.
#
# WHY `streamLength` AND NOT `pendingEntriesCount`
# ------------------------------------------------
# `pendingEntriesCount` is the size of the consumer group's Pending Entries List
# — entries already DELIVERED to a worker but not yet acked. Our broker acks and
# XDELs immediately on success (backend/broker/redis_broker.py::ack), so the PEL
# only ever holds the batch currently in flight, bounded by
# batching.max_batch_size (32) per replica. A 5,000-job backlog sitting unread in
# the stream contributes ZERO to it, so a PEL-based trigger essentially never
# fires — the autoscaler looked correct and did nothing.
#
# Because ack also XDELs, XLEN *is* the accurate unprocessed backlog, which is
# exactly what `streamLength` reads. `activationLagCount`/`activationValue` keeps
# a replica from waking on a single stray job.
#
# Requires KEDA in the cluster:  helm install keda kedacore/keda -n keda --create-namespace
# Apply separately (kept out of the default kustomize build so `apply -k` works
# without KEDA):  kubectl apply -f k8s/autoscaling-keda.yaml
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-yolo
  namespace: inferno
spec:
  scaleTargetRef:
    name: worker-yolo
  minReplicaCount: 1
  maxReplicaCount: 8
  pollingInterval: 10        # check the backlog every 10s
  cooldownPeriod: 120        # wait 120s of idle before scaling down
  triggers:
    - type: redis-streams
      metadata:
        address: redis.inferno.svc.cluster.local:6379
        stream: "inferno:jobs:yolo-detect"
        consumerGroup: "inferno-workers"
        streamLength: "20"        # >20 queued per replica → scale up
        activationStreamLength: "1"
    # Express lane: priority jobs live on a separate stream, so without
    # this trigger a backlog of high-priority work would never scale up.
    - type: redis-streams
      metadata:
        address: redis.inferno.svc.cluster.local:6379
        stream: "inferno:jobs:yolo-detect:express"
        consumerGroup: "inferno-workers"
        streamLength: "10"
        activationStreamLength: "1"
