# Queue-depth autoscaling — the right way to scale ML workers.
#
# CPU HPAs are a poor proxy for inference workers (a worker blocked on a slow
# forward pass shows low CPU while the queue backs up). KEDA's redis-streams
# scaler reads the ACTUAL backlog — pending entries on each model's job stream
# (inferno:jobs:<model>, consumer group "inferno-workers") — and scales that
# model's Deployment to keep ~pendingEntriesCount jobs queued per replica.
# Scale-to-zero is possible (minReplicaCount: 0) for rarely-used models.
#
# Requires KEDA in the cluster:  helm install keda kedacore/keda -n keda --create-namespace
# Apply separately (kept out of the default kustomize build so `apply -k` works
# without KEDA):  kubectl apply -f k8s/autoscaling-keda.yaml
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-yolo
  namespace: inferno
spec:
  scaleTargetRef:
    name: worker-yolo
  minReplicaCount: 1
  maxReplicaCount: 8
  pollingInterval: 10        # check the backlog every 10s
  cooldownPeriod: 120        # wait 120s of idle before scaling down
  triggers:
    - type: redis-streams
      metadata:
        address: redis.inferno.svc.cluster.local:6379
        stream: "inferno:jobs:yolo-detect"
        consumerGroup: "inferno-workers"
        pendingEntriesCount: "20"   # >20 queued per replica → scale up
