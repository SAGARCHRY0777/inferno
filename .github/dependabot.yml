# Automated dependency updates.
#
# The repo had no dependency automation at all, so pins quietly aged: a scan on
# 2026-08-27 found 19 advisories across 4 packages in requirements.txt alone
# (starlette, python-multipart, mcp, pytest), plus CVE-2025-32434 in the pinned
# torch. Nothing in the project would ever have surfaced the next one.
#
# Grouped so you get a few reviewable PRs instead of a swarm of single-pin bumps.
version: 2

updates:
  # --- Python ---------------------------------------------------------------- #
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    groups:
      # Web stack moves together: FastAPI pins a starlette range, so bumping one
      # without the other produces an uninstallable combination.
      web:
        patterns: ["fastapi", "starlette", "uvicorn*", "python-multipart", "websockets", "httpx"]
      # tokenizers and safetensors carry no independent version story: both are
      # pinned to whatever range transformers accepts, so leaving them out makes
      # the group unresolvable. transformers 5.18 wants tokenizers>=0.23.1
      # against a pin of 0.22.2, and pip gives up. Same failure the react group
      # had before react-leaflet joined it.
      ml:
        patterns: ["torch*", "torchvision", "onnxruntime*", "ultralytics", "transformers", "sentence-transformers", "faster-whisper", "tokenizers", "safetensors"]
      observability:
        patterns: ["opentelemetry*", "prometheus-client", "structlog"]
      dev:
        patterns: ["pytest*", "ruff", "mypy", "locust"]

  # --- Frontend -------------------------------------------------------------- #
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "frontend"]
    groups:
      react:
      # react-leaflet belongs here, not in `ui`, for the same reason fastapi and
      # starlette share a group above: its peer range is pinned to one react
      # major, so splitting them produces an uninstallable combination. That is
      # not hypothetical -- react-leaflet 4.2.1 caps at `react ^18.0.0`, so the
      # react 19 PR failed `npm ci` with ERESOLVE before it could build, and
      # react-leaflet 5.0.0 requires `react ^19.0.0`, so it cannot land on its
      # own either. They only work as a pair.
        patterns: ["react", "react-dom", "@types/react*", "react-leaflet"]
      build:
        patterns: ["vite", "@vitejs/*", "typescript", "eslint*", "@typescript-eslint/*"]
      runtime:
        patterns: ["leaflet", "framer-motion", "recharts", "zustand"]

  # --- GitHub Actions -------------------------------------------------------- #
  # Pinned action versions go stale too, and a deprecated runner image is a
  # silent CI failure waiting to happen.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies", "ci"]
