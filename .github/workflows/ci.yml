name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------- #
  # Backend: lint + unit/integration tests against a real Redis service.         #
  # Core deps only (no torch) -> fast. The ML-marked tests run in the ml job.    #
  # --------------------------------------------------------------------------- #
  backend:
    name: Backend · lint + tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          # ruff pinned to the version in requirements.lock.txt: an unpinned tool
          # turns CI red on an unrelated PR the day a new rule ships.
          pip install -r requirements.txt "ruff==0.8.4"
      - name: Ruff lint
        run: ruff check backend
      - name: Pytest (unit + integration, excluding heavy ML)
        env:
          INFERNO_REDIS__URL: redis://localhost:6379/0
        run: pytest backend/tests -m "not ml" -p no:cacheprovider

  # --------------------------------------------------------------------------- #
  # ML: the heavy model paths on the CPU stack.                                  #
  # --------------------------------------------------------------------------- #
  ml:
    name: Backend · ML model tests (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install core + CPU ML stack
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-ml-cpu.txt
      - name: Pytest (ML-marked)
        run: pytest backend/tests -m ml -p no:cacheprovider

  # --------------------------------------------------------------------------- #
  # Frontend: lint, typecheck, production build.                                 #
  # --------------------------------------------------------------------------- #
  frontend:
    name: Frontend · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # --------------------------------------------------------------------------- #
  # Docker: validate the slim core gateway image + the frontend image build.     #
  # The full ML image (./Dockerfile, torch/OpenCV/Whisper/YOLO) won't fit a free  #
  # runner's disk, so it's a local/compose concern. No GHCR push, no gha cache    #
  # (both add failure surface with no real signal on a portfolio repo).           #
  # --------------------------------------------------------------------------- #
  docker:
    name: Docker · build images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build core gateway image (slim, no ML)
        run: docker build -f deploy/Dockerfile.core -t inferno-gateway:ci .
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t inferno-frontend:ci ./frontend
      # This is the image the live Render demo is built from (render.yaml has
      # autoDeploy: true), so a break here used to surface only at deploy time.
      # Slim like the core image -- no ML stack -- so it fits a free runner.
      - name: Build demo image (the one Render deploys)
        run: docker build -f deploy/Dockerfile.demo -t inferno-demo:ci .

  ci-success:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [backend, ml, frontend, docker]
    steps:
      - run: echo "All CI jobs passed."
