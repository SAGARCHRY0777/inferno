# ─────────────────────────────────────────────────────────────────────────────
# ☕ Keep the demo warm
#
# The public demo runs on a free Render instance, which spins down after ~15
# minutes of inactivity. A cold start then takes ~30 seconds and the first
# request gets an HTTP 503 — which is exactly what a reviewer clicking the
# demo link on the README sees, once, before closing the tab.
#
# So this pings the health endpoint on a schedule to keep the instance awake.
#
# MEASURED: the schedule below does not work, and cannot be made to work by
# tuning the cron. Over 144 hours this workflow asked for 144 runs/day and
# GitHub delivered 5 -- 3.5% -- with a median gap of 288 minutes and a best-ever
# gap of 154. Render sleeps at ~15 minutes idle, so even the closest pair of runs
# ever observed was ten times too far apart. The demo was cold for effectively
# every visitor, and a 33-second first request confirmed it.
#
# Keep it anyway for `workflow_dispatch`: a manual wake a minute before sharing
# the link is genuinely useful, and that path is reliable. Just do not believe
# the cron.
#
# To actually keep it warm, point an external pinger at
# https://inferno-ny28.onrender.com/api/v1/health every 5 minutes --
# UptimeRobot's free tier or cron-job.org both do this and both honour the
# interval. That is a signup, which is why this file exists; it is also the only
# thing that works.
#
# One more caveat, unrelated and still true: GitHub disables scheduled workflows
# on repositories with no activity for 60 days.
#
# It never fails the run: a sleeping demo is not a broken build, and a red X in
# the Actions tab for a warm-up ping would be noise on top of the CI signal.
# ─────────────────────────────────────────────────────────────────────────────
name: ☕ Keep demo warm

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 min; Render sleeps at ~15 min idle
  workflow_dispatch: # manual wake-up before sharing the link

# A queued warm-up is worthless once the next one is due — keep only the newest.
concurrency:
  group: keepalive
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ping:
    name: Ping the live demo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the instance
        run: |
          BASE="https://inferno-ny28.onrender.com"

          # --max-time 90 covers a full cold start (~30s) with headroom.
          # --retry 2 rides out the 503 the instance serves while booting.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
                   --max-time 90 --retry 2 --retry-delay 15 \
                   --retry-all-errors \
                   "$BASE/api/v1/health" || echo "000")

          echo "GET /api/v1/health -> $code"

          if [ "$code" = "200" ]; then
            echo "::notice::Demo is awake (200)."
          else
            # Not a failure: the next scheduled ping is the retry.
            echo "::warning::Demo returned $code — likely still booting."
          fi
