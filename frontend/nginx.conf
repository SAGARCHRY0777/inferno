server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Reverse-proxy the API + WebSockets to the gateway service.
  location /api/ {
    proxy_pass http://gateway:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location /metrics {
    proxy_pass http://gateway:8000;
  }

  # Streaming chat service (Server-Sent Events). proxy_buffering off so tokens
  # flush to the browser immediately instead of being held by nginx.
  location /chat {
    proxy_pass http://chat:8100;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }
}
