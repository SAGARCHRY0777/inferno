# Render.com blueprint for a clickable Inferno demo (core, no heavy ML).
# In Render: New + > Blueprint > point at this repo. It provisions:
#   - a Redis instance
#   - the gateway (web service)
#   - a dummy-echo worker (background worker)
#   - the frontend (static site) built to talk to the gateway
# The heavy ML models (yolo/whisper/distilbert/RAG/chat) need a paid instance
# with enough RAM/CPU; run those locally or scale a worker up.

services:
  - type: redis
    name: inferno-redis
    plan: free
    ipAllowList: []

  - type: web
    name: inferno-gateway
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile.core
    plan: free
    envVars:
      - key: INFERNO_REDIS__URL
        fromService: { name: inferno-redis, type: redis, property: connectionString }
      - key: INFERNO_SERVER__CORS_ORIGINS
        value: '["*"]'
      - key: PORT
        value: "8000"

  - type: worker
    name: inferno-worker-dummy
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile.core
    plan: free
    dockerCommand: python -m backend.worker.main
    envVars:
      - key: INFERNO_REDIS__URL
        fromService: { name: inferno-redis, type: redis, property: connectionString }
      - key: INFERNO_WORKER__MODEL_NAME
        value: dummy-echo

  - type: web
    name: inferno-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      # Point the built UI at the deployed gateway (set after the gateway is live).
      - key: VITE_API_BASE
        value: https://inferno-gateway.onrender.com/api/v1
