# Render.com blueprint — FREE one-click deploy of the clickable Inferno demo.
#
# A SINGLE web service (no separate Redis/worker/frontend services, no paid
# background worker) built from deploy/Dockerfile.demo: one container runs Redis
# + a dummy-echo worker + the gateway, and the gateway serves the UI same-origin
# so the API and WebSockets work with zero extra config.
#
# Deploy:  Render Dashboard -> New + -> Blueprint -> pick this repo -> Apply.
# The free instance sleeps after ~15 min idle and wakes on the next request
# (~30s cold start). The heavy ML models stay local — this demo serves the
# dependency-free dummy-echo model (which is what the stress test exercises),
# plus the full dashboard, 20 themes, command palette, and Fleet map.
services:
  - type: web
    name: inferno
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile.demo
    plan: free
    healthCheckPath: /api/v1/health
    autoDeploy: true
